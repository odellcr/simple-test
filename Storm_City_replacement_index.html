<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Storm City">
<meta name="theme-color" content="#101827">
<title>Storm City</title>
<style>
:root{--bg:#0b1020;--panel:#121a2b;--panel2:#18233a;--text:#e8edf7;--muted:#9eabc2;--accent:#7dd3fc;--good:#86efac;--bad:#fca5a5;--gold:#facc15}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:#253453;color:white;font-weight:650;cursor:pointer}button:active{transform:translateY(1px)}button.primary{background:#0369a1}button.good{background:#166534}button.warn{background:#92400e}button.danger{background:#991b1b}
#app{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.brand h1{margin:0;font-size:26px}.brand small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:var(--panel);border:1px solid #26324a;border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}nav button{background:#17223a}nav button.active{background:#075985;box-shadow:inset 0 -3px 0 var(--accent)}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.panel{background:rgba(18,26,43,.96);border:1px solid #26324a;border-radius:14px;padding:14px}.panel h2,.panel h3{margin:0 0 8px}.muted{color:var(--muted)}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.stack>*+*{margin-top:8px}.cards{display:grid;gap:9px}.card{background:#18233a;border:1px solid #2a3854;border-radius:11px;padding:11px}.card h3{margin:0 0 5px}.card p{margin:5px 0;color:#c7d1e3}.choices{display:grid;gap:7px;margin-top:9px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#263453;color:#b9d9ff;font-size:11px;margin:2px}.log{max-height:360px;overflow:auto}.log div{padding:8px 0;border-bottom:1px solid #26324a}.goodtxt{color:var(--good)}.badtxt{color:var(--bad)}.gold{color:var(--gold)}.hidden{display:none}.meter{height:8px;background:#25304a;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:#38bdf8}.footer{color:var(--muted);font-size:11px;text-align:center;margin:14px}
@media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}#app{padding:10px}.top{align-items:flex-start}.brand h1{font-size:23px}}
</style>

<style>
#iosHelp{display:none;background:#17233a;border:1px solid #365071;border-radius:12px;padding:11px;margin-bottom:12px;color:#dbeafe}
#iosHelp b{color:white} #iosHelp button{margin-top:8px;padding:8px 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="storm-city-save-v1";
const initial={
 year:427, day:1, mode:"IT", money:50000, population:50000, food:72, security:68,
 infrastructure:45, publicSupport:60, eyeRep:25, advRep:0, stability:62, trade:58,
 magic:70, blackSky:18, info:20, tech:20, politicalRep:20,
 factions:{
  "The Eye":50,"Government":50,"Storm Ledger":50,"Defense Force":50,"Black Sky":25
 },
 party:[
  {name:"Alden",role:"Warrior",hp:100,max:100,skill:55,xp:0,wealth:500},
  {name:"Mira",role:"Mage",hp:80,max:80,skill:60,xp:0,wealth:500},
  {name:"Vey",role:"Rogue",hp:85,max:85,skill:58,xp:0,wealth:500}
 ],
 partyRep:10, partyWealth:1500, level:"Bronze",
 itRank:"Junior Eye Employee", politicalRank:"Local Official",
 projects:[], completed:[], events:[], turn:1,
 log:["Year 427, Day 1 — Storm City is stable enough to begin. The Eye has assigned you a junior infrastructure portfolio."]
};

const modeData={
 IT:{title:"THE EYE",subtitle:"Infrastructure & Operations",intro:"Solve practical infrastructure problems. Every solution creates tradeoffs."},
 ADVENTURE:{title:"ADVENTURE",subtitle:"Contracts & Expeditions",intro:"Run a small adventuring party and turn information into action."},
 POLITICAL:{title:"POLITICS",subtitle:"Storm City Government",intro:"Manage the city while balancing factions, resources and public support."}
};

const itEvents=[
 {t:"Nimbus Site Connectivity",d:"A remote Eye facility needs reliable connectivity. Current portal traffic is intermittent.",choices:[
  ["Deploy redundant site network",()=>effect({money:-9000,infrastructure:5,eyeRep:4,info:3}, "Nimbus connectivity stabilized. Redundancy raises operating cost.", "IT")],
  ["Use existing infrastructure",()=>effect({money:-2500,infrastructure:1,eyeRep:1,security:-3}, "Cheap connectivity works, but the failure domain remains.", "IT")],
  ["Send an adventuring party to inspect the site",()=>triggerCross("Nimbus inspection", "ADVENTURE", {money:-1000,info:8})]]},
 {t:"Identity Outage",d:"An Eye office cannot reliably authenticate users. Staff are sharing temporary local credentials.",choices:[
  ["Deploy centralized identity",()=>effect({money:-7000,security:5,eyeRep:5,tech:3}, "Central identity is online. Local credentials are being retired.", "IT")],
  ["Patch each workstation",()=>effect({money:-1800,security:-2,eyeRep:1}, "The outage is reduced, but the underlying management problem remains.", "IT")],
  ["Escalate to government cyber authority",()=>effect({info:5,politicalRep:2,eyeRep:-1}, "Government security staff join the investigation.", "POLITICAL")]]},
 {t:"Portal Network Instability",d:"Portal telemetry shows increasing packet loss and magical instability.",choices:[
  ["Take the portal offline for maintenance",()=>effect({money:-3000,trade:-8,magic:5,security:5}, "The portal is safe, but commerce is disrupted.", "IT")],
  ["Keep it online and tune routing",()=>effect({money:-4500,trade:5,magic:-5,infrastructure:3}, "Trade continues while the system operates closer to its limits.", "IT")],
  ["Hire adventurers to investigate the chamber",()=>triggerCross("Unstable portal investigation","ADVENTURE",{money:-1500,info:10})]]},
 {t:"Black Sky Probe",d:"Monitoring detects suspicious traffic against an Eye service.",choices:[
  ["Isolate the service",()=>effect({money:-4000,security:7,trade:-3,blackSky:-4}, "The service is isolated. Black Sky loses access but notices the defense.", "IT")],
  ["Observe and collect telemetry",()=>effect({info:12,blackSky:5,security:-2}, "You learn more about the probe, but allow continued access.", "IT")],
  ["Notify Defense Force",()=>effect({security:5,politicalRep:3,info:6}, "The Defense Force begins a joint investigation.", "POLITICAL")]]}
];

const advEvents=[
 {t:"Missing Caravan",d:"A merchant caravan vanished near a cloud-road junction.",choices:[
  ["Track the caravan",()=>advResult(9,250,4,"You find the caravan abandoned. Evidence points toward organized theft.")],
  ["Question nearby merchants",()=>advResult(6,150,3,"Rumors identify a suspicious broker connected to Storm Ledger.")],
  ["Accept a higher-risk night search",()=>advResult(4,500,6,"The party finds survivors, but Vey is injured during the escape.")]]},
 {t:"Abandoned Cloud Facility",d:"An old facility contains dormant machinery and a sealed data vault.",choices:[
  ["Explore carefully",()=>advResult(8,400,5,"You recover technical records that increase The Eye's knowledge.")],
  ["Break the vault",()=>advResult(5,650,2,"The vault opens. Valuable equipment is recovered, but evidence is damaged.")],
  ["Report it to The Eye",()=>effect({info:9,eyeRep:4,money:300},"The Eye takes custody of the site and rewards the party.","ADVENTURE")]]},
 {t:"Black Sky Activity",d:"A suspected Black Sky cell is moving through an industrial district.",choices:[
  ["Observe and report",()=>advResult(8,200,7,"You identify a safehouse without exposing the party.")],
  ["Confront them",()=>advResult(5,700,4,"The cell escapes, but the party recovers stolen equipment.")],
  ["Coordinate with Defense Force",()=>effect({security:5,blackSky:-5,advRep:4,info:6},"The operation succeeds with military support.","ADVENTURE")]]},
 {t:"Unstable Portal Chamber",d:"The portal chamber from an Eye report is becoming dangerous.",choices:[
  ["Stabilize the chamber",()=>advResult(7,300,5,"The portal is stabilized long enough for engineers to work.")],
  ["Recover the artifact causing the instability",()=>advResult(5,900,3,"The artifact is recovered. Its purpose is still unknown.")],
  ["Withdraw and warn The Eye",()=>effect({info:6,eyeRep:2,magic:3},"You avoid casualties and deliver actionable intelligence.","ADVENTURE")]]}
];

const polEvents=[
 {t:"Food Supply Shortage",d:"A poor harvest in Cumulus is driving food prices upward.",choices:[
  ["Release treasury reserves",()=>effect({money:-7000,food:12,publicSupport:6,stability:3},"Emergency food purchases stabilize prices.","POLITICAL")],
  ["Reduce portal tariffs",()=>effect({trade:7,money:-2500,food:8,publicSupport:3},"Cheaper imports arrive quickly.","POLITICAL")],
  ["Do nothing",()=>effect({food:-10,publicSupport:-8,stability:-6},"Prices rise and unrest grows.","POLITICAL")]]},
 {t:"Portal Expansion Proposal",d:"Merchants want another portal connection. The Defense Force warns about security exposure.",choices:[
  ["Approve construction",()=>effect({money:-12000,trade:12,infrastructure:8,security:-5,stability:-2},"The portal increases commerce but expands the attack surface.","POLITICAL")],
  ["Reject the project",()=>effect({trade:-5,publicSupport:-2,security:4},"Security improves, but merchants are frustrated.","POLITICAL")],
  ["Fund a security review first",()=>effect({money:-3500,info:8,politicalRep:4},"The city buys information before committing to construction.","POLITICAL")]]},
 {t:"Labor Dispute",d:"Workers threaten a strike over wages and dangerous infrastructure conditions.",choices:[
  ["Increase wages",()=>effect({money:-5000,publicSupport:6,stability:4},"Workers return to work after a costly settlement.","POLITICAL")],
  ["Deploy mediators",()=>effect({money:-1500,stability:3,publicSupport:2},"A compromise prevents a strike.","POLITICAL")],
  ["Use enforcement",()=>effect({security:3,publicSupport:-10,stability:-8},"The strike ends, but resentment grows.","POLITICAL")]]},
 {t:"Black Sky Investigation",d:"Evidence suggests Black Sky influence inside a city contractor.",choices:[
  ["Public investigation",()=>effect({money:-4000,blackSky:-7,publicSupport:5,stability:-2},"The contractor is exposed. Several powerful people are embarrassed.","POLITICAL")],
  ["Quiet intelligence operation",()=>effect({money:-2500,info:10,blackSky:-5,politicalRep:5},"The operation uncovers a larger network.","POLITICAL")],
  ["Avoid escalation",()=>effect({blackSky:7,stability:2},"The immediate political cost is avoided, but Black Sky gains room to operate.","POLITICAL")]]}
];

function clone(x){return JSON.parse(JSON.stringify(x))}
let state=load();

function load(){
  try { return JSON.parse(window.localStorage.getItem(KEY)) || clone(initial); }
  catch(e) { return clone(initial); }
}
function save(){
  try { window.localStorage.setItem(KEY,JSON.stringify(state)); } catch(e) {}
}
function clamp(v){return Math.max(0,Math.min(100,Math.round(v)))}
function num(v){return Math.round(v).toLocaleString()}
function effect(changes,msg,nextMode){
 Object.entries(changes).forEach(([k,v])=>{
  if(k==="money")state.money+=v;
  else if(k==="population")state.population+=v;
  else if(k==="info")state.info=clamp(state.info+v);
  else if(k==="tech")state.tech=clamp(state.tech+v);
  else if(k==="partyWealth")state.partyWealth+=v;
  else if(k==="advRep")state.advRep=clamp(state.advRep+v);
  else if(k==="politicalRep")state.politicalRep=clamp(state.politicalRep+v);
  else if(k==="eyeRep")state.eyeRep=clamp(state.eyeRep+v);
  else if(k==="food"||k==="security"||k==="infrastructure"||k==="publicSupport"||k==="stability"||k==="trade"||k==="magic"||k==="blackSky")state[k]=clamp(state[k]+v);
 });
 state.log.unshift(`Day ${state.day}: ${msg}`);
 if(nextMode)state.mode=nextMode;
 tick(); render(); save();
}
function triggerCross(title,mode,changes){
 Object.assign(state,{mode});
 Object.entries(changes).forEach(([k,v])=>{if(k==="money")state.money+=v;else state[k]=clamp((state[k]||0)+v)});
 state.log.unshift(`Day ${state.day}: ${title} moved into ${mode} mode.`);
 tick(); render(); save();
}
function tick(){
 state.day++;
 if(state.day%30===0){
  state.year++;
  state.day=1;
  state.money+=Math.round(state.trade*60)-Math.round((100-state.security)*20);
  state.food=clamp(state.food-3+Math.round(state.infrastructure/25));
  state.blackSky=clamp(state.blackSky+(Math.random()<.35?4:-2));
  state.publicSupport=clamp(state.publicSupport+(state.food>55?2:-4));
  state.log.unshift(`Year ${state.year}: Storm City enters a new year.`);
 }
 if(state.money<0){state.stability=clamp(state.stability-8);state.log.unshift("Treasury deficit is destabilizing the city.");}
 updateRanks();
}
function updateRanks(){
 if(state.eyeRep>=70)state.itRank="Eye Infrastructure Leadership";
 else if(state.eyeRep>=50)state.itRank="Senior Architect";
 else if(state.eyeRep>=35)state.itRank="Architect";
 else if(state.eyeRep>=20)state.itRank="Site Administrator";
 if(state.advRep>=80)state.level="Mythic";else if(state.advRep>=60)state.level="Platinum";else if(state.advRep>=40)state.level="Gold";else if(state.advRep>=20)state.level="Silver";
 if(state.politicalRep>=70)state.politicalRank="Kingdom-level Influence";else if(state.politicalRep>=50)state.politicalRank="Major Political Figure";else if(state.politicalRep>=35)state.politicalRank="City Leadership";else if(state.politicalRep>=20)state.politicalRank="District Authority";
}
function currentEvents(){return state.mode==="IT"?itEvents:state.mode==="ADVENTURE"?advEvents:polEvents}
function pickEvent(){
 const pool=currentEvents(); return pool[(state.turn-1)%pool.length]
}
function advResult(chance,reward,rep,msg){
 const avg=state.party.reduce((a,p)=>a+p.skill,0)/state.party.length;
 const roll=Math.random()*10+avg/10;
 if(roll>=chance){
  state.partyWealth+=reward; state.advRep=clamp(state.advRep+rep); state.info=clamp(state.info+2);
  state.log.unshift(`Day ${state.day}: ${msg} Party earned ${reward} crowns.`);
 }else{
  const p=state.party[Math.floor(Math.random()*state.party.length)];
  p.hp=Math.max(1,p.hp-15);
  state.advRep=clamp(state.advRep-1);
  state.log.unshift(`Day ${state.day}: The expedition goes poorly. ${p.name} is injured. Party morale suffers.`);
 }
 tick();render();save();
}
function modeChange(m){state.mode=m;state.turn++;render();save()}
function reset(){if(confirm("Reset the Storm City campaign?")){state=clone(initial);save();render()}}
function cardEvent(){
 const e=pickEvent();
 return `<div class="card"><div class="row"><div><h3>${e.t}</h3><span class="tag">${state.mode}</span></div><span class="muted">Day ${state.day}</span></div><p>${e.d}</p><div class="choices">${e.choices.map((c,i)=>`<button onclick="choose(${i})">${c[0]}</button>`).join("")}</div></div>`
}
function choose(i){const e=pickEvent();e.choices[i][1]();state.turn++}
function meter(label,v){return `<div><div class="row"><span>${label}</span><b>${v}</b></div><div class="meter"><i style="width:${v}%"></i></div></div>`}
function render(){
 const m=modeData[state.mode];
 document.getElementById("app").innerHTML=`
 <div class="top"><div class="brand"><h1>STORM CITY</h1><small>Cloud Kingdom • Year ${state.year} • Day ${state.day}</small></div>
 <div><button onclick="save()">Save</button> <button onclick="reset()">New Game</button></div></div>
 <div class="stats">
  <div class="stat"><b>${num(state.money)}</b><span>CROWNS</span></div>
  <div class="stat"><b>${num(state.population)}</b><span>POPULATION</span></div>
  <div class="stat"><b>${state.security}</b><span>SECURITY</span></div>
  <div class="stat"><b>${state.stability}</b><span>STABILITY</span></div>
 </div>
 <nav>
  <button class="${state.mode==="IT"?"active":""}" onclick="modeChange('IT')">THE EYE</button>
  <button class="${state.mode==="ADVENTURE"?"active":""}" onclick="modeChange('ADVENTURE')">ADVENTURE</button>
  <button class="${state.mode==="POLITICAL"?"active":""}" onclick="modeChange('POLITICAL')">POLITICS</button>
 </nav>
 <div class="grid">
  <main class="panel stack">
   <div><h2>${m.title}</h2><div class="muted">${m.subtitle}</div><p>${m.intro}</p></div>
   ${state.mode==="IT"?itView():state.mode==="ADVENTURE"?advView():polView()}
   <div><h3>Active Event</h3>${cardEvent()}</div>
  </main>
  <aside class="stack">
   ${worldView()}
   ${state.mode==="ADVENTURE"?partyView():""}
   <div class="panel"><h3>World Log</h3><div class="log">${state.log.slice(0,18).map(x=>`<div>${x}</div>`).join("")}</div></div>
  </aside>
 </div>
 <div class="footer">Decisions alter shared world state. There is no single optimal path.</div>`;
}
function itView(){return `<div class="panel" style="padding:0;border:0;background:none"><h3>Infrastructure Portfolio</h3><div class="cards">
 <div class="card"><b>Network</b><p>Infrastructure ${state.infrastructure} • Tech ${state.tech}</p>${meter("Network resilience",state.infrastructure)}</div>
 <div class="card"><b>Security Operations</b><p>Black Sky activity: ${state.blackSky}</p>${meter("Security posture",state.security)}</div>
 <div class="card"><b>Career</b><p>${state.itRank} • Eye reputation ${state.eyeRep}</p>${meter("Eye reputation",state.eyeRep)}</div>
 </div></div>`}
function advView(){return `<div class="panel" style="padding:0;border:0;background:none"><h3>Adventuring Company</h3><div class="cards">
 <div class="card"><b>Rank: ${state.level}</b><p>Reputation ${state.advRep} • Party wealth ${num(state.partyWealth)} crowns</p>${meter("Reputation",state.advRep)}</div>
 <div class="card"><b>Contract Capacity</b><p>Average party skill: ${Math.round(state.party.reduce((a,p)=>a+p.skill,0)/state.party.length)}</p><button onclick="restParty()">Rest party</button></div>
 </div></div>`}
function polView(){return `<div class="panel" style="padding:0;border:0;background:none"><h3>City Administration</h3><div class="cards">
 <div class="card"><b>Public Support</b>${meter("Support",state.publicSupport)}</div>
 <div class="card"><b>Economy</b><p>Trade ${state.trade} • Food ${state.food}</p>${meter("Trade",state.trade)}${meter("Food supply",state.food)}</div>
 <div class="card"><b>Political standing</b><p>${state.politicalRank} • Reputation ${state.politicalRep}</p>${meter("Political reputation",state.politicalRep)}</div>
 </div></div>`}
function worldView(){return `<div class="panel"><h3>Shared World State</h3><div class="stack">
 ${meter("Infrastructure",state.infrastructure)}
 ${meter("Food",state.food)}
 ${meter("Security",state.security)}
 ${meter("Public support",state.publicSupport)}
 ${meter("Trade",state.trade)}
 ${meter("Magic stability",state.magic)}
 ${meter("Black Sky activity",state.blackSky)}
 <div class="row"><span>Information</span><b>${state.info}</b></div>
 </div></div>
 <div class="panel"><h3>Faction Standing</h3>${Object.entries(state.factions).map(([k,v])=>`<div class="row" style="padding:5px 0"><span>${k}</span><b>${v}</b></div>`).join("")}</div>`}
function partyView(){return `<div class="panel"><h3>Party</h3>${state.party.map(p=>`<div class="card" style="margin-top:7px"><div class="row"><b>${p.name}</b><span>${p.role}</span></div><div>HP ${p.hp}/${p.max} • Skill ${p.skill}</div></div>`).join("")}</div>`}
function restParty(){state.party.forEach(p=>p.hp=Math.min(p.max,p.hp+25));state.log.unshift(`Day ${state.day}: The party rests and recovers.`);tick();render();save()}
try { render(); }
catch(err) {
  document.getElementById("app").innerHTML = `<div class="panel"><h2>Storm City failed to start</h2><p>The page loaded, but its game script encountered an error.</p><pre style="white-space:pre-wrap;color:#fca5a5">${String(err && err.stack ? err.stack : err)}</pre><p>Replace the GitHub <code>index.html</code> with this version.</p></div>`;
  console.error(err);
}
</script>

<script>
(function(){
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)&&!window.MSStream;
  const isFile=location.protocol==="file:";
  if(isIOS&&isFile){
    document.addEventListener("DOMContentLoaded",function(){
      const app=document.getElementById("app");
      if(!app)return;
      const h=document.createElement("div");
      h.id="iosHelp";
      h.innerHTML="<b>iPhone local-file mode</b><br>"
        +"If this file opens as a preview instead of a playable page, tap the Share button and choose <b>Open in Safari</b>. "
        +"If Safari is unavailable in the share sheet, use the Files app's Share menu to send the file to Safari.";
      app.prepend(h);
      h.style.display="block";
    });
  }
})();
</script>
</body>
</html>
