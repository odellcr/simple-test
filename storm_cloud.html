<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storm City — Cloud Kingdom Simulation</title>
<style>
:root{
  --ink:#0c1220; --panel:#131b2c; --panel2:#19243a; --line:#27344f; --text:#d8dfec; --dim:#8a97b2;
  --pol:#e0b45c; --adv:#dc7752; --eye:#5cc6d6; --bad:#e2606c; --good:#7cc99b;
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif; --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 var(--sans)}
body{min-height:100vh;background:radial-gradient(1200px 500px at 70% -10%,#1a2744 0,transparent 60%),var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--eye);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h2{font-size:1.35rem;margin-bottom:.4rem}
h3{font-size:1.05rem;margin:1.4rem 0 .5rem}
h4{margin:.9rem 0 .25rem;font-size:.9rem;color:var(--dim);font-weight:600}
p{margin:.3rem 0}
.top{position:relative;overflow:hidden;display:flex;align-items:center;gap:1.2rem;padding:.9rem 1.2rem;border-bottom:1px solid var(--line);background:linear-gradient(100deg,#101a30,#16213a)}
.top.pm{background:linear-gradient(100deg,#171726,#2a2036 70%,#3a2a3a)}
.top::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(105deg,transparent 40%,rgba(200,230,255,.55) 49%,rgba(255,255,255,.8) 50%,rgba(200,230,255,.5) 51%,transparent 60%)}
.top.flash::after{animation:bolt .8s ease-out}
@keyframes bolt{0%{opacity:0;transform:translateX(-30%)}15%{opacity:1}100%{opacity:0;transform:translateX(30%)}}
.brand h1{font-size:1.6rem;letter-spacing:.01em}
.brand span{color:var(--dim);font-size:.8rem}
.clock{margin-left:auto;text-align:right;font-family:var(--serif)}
.clock b{display:block;font-size:1.3rem;font-weight:600}
.clock span{color:var(--dim);font-size:.9rem}
.purse{text-align:right;min-width:90px}
.purse b{font-size:1.2rem;font-variant-numeric:tabular-nums}
.purse span{display:block;color:var(--dim);font-size:.78rem}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:.45rem .8rem}
.btn:hover{border-color:var(--dim)}
.btn.primary{border-color:#3b5280;background:#1f2e4d}
.shell{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 70px)}
nav{border-right:1px solid var(--line);padding:1rem .6rem;display:flex;flex-direction:column;gap:.25rem;background:rgba(10,15,28,.5)}
nav button{text-align:left;background:none;border:0;border-left:3px solid transparent;padding:.55rem .7rem;border-radius:0 6px 6px 0;color:var(--dim)}
nav button:hover{background:var(--panel)}
nav button.on{background:var(--panel);color:var(--text);border-left-color:var(--c,var(--text))}
nav small{display:block;color:var(--dim);font-size:.72rem}
nav .sp{flex:1}
main{padding:1.1rem 1.4rem 3rem;max-width:980px}
.pulse{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:.6rem;margin-bottom:1rem}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.5rem .7rem}
.chip label{display:block;color:var(--dim);font-size:.75rem}
.chip b{font-size:.98rem;font-weight:600}
.chip .tr{float:right;font-size:.8rem}
.up{color:var(--good)}.dn{color:var(--bad)}
.bar{height:4px;background:#0b1020;border-radius:3px;margin-top:.4rem;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--dim));border-radius:3px}
.banner{border:1px solid var(--line);border-left:3px solid var(--eye);background:var(--panel);border-radius:6px;padding:.6rem .9rem;margin-bottom:1rem}
.banner p{margin:.15rem 0;font-size:.92rem}
.banner .x{float:right;background:none;border:0;color:var(--dim)}
.intro{border-left-color:var(--pol)}
.story{font-family:var(--serif);font-size:1.08rem;line-height:1.55;margin:.2rem 0 .8rem}
.odd{border-left:3px solid var(--bad);background:#241723;padding:.5rem .8rem;border-radius:6px;margin:.5rem 0;font-size:.92rem}
.ev{border:1px solid var(--line);background:var(--panel);border-radius:8px;margin:.5rem 0}
.ev.s4,.ev.s5{border-color:#6b3040}
.ev.opp{border-color:#2f5a4a}
.evh{display:flex;gap:.8rem;align-items:center;width:100%;background:none;border:0;padding:.65rem .8rem;text-align:left}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:7px;height:16px;border-radius:2px;background:#26334e}
.pips i.f{background:var(--warn,#d9a24a)}
.s4 .pips i.f,.s5 .pips i.f{background:var(--bad)}
.opp .pips i.f{background:var(--good)}
.evt{flex:1;min-width:0}
.evt b{display:block;font-weight:600}
.evt i{display:block;color:var(--dim);font-style:normal;font-size:.88rem}
.evm{color:var(--dim);font-size:.78rem;white-space:nowrap}
.evb{padding:0 .9rem .8rem;border-top:1px solid var(--line)}
.ln b{display:inline-block;min-width:4.6rem;font-size:.8rem}
.ln.pol b{color:var(--pol)}.ln.adv b{color:var(--adv)}.ln.eye b{color:var(--eye)}
.sus{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}
.sus span{background:#0f1729;border:1px solid var(--line);border-radius:12px;padding:.1rem .6rem;font-size:.85rem}
.sus em{font-style:normal;letter-spacing:2px;color:var(--eye);margin-left:.3rem}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.55rem;margin:.4rem 0}
.act{display:block;text-align:left;background:var(--panel2);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;padding:.55rem .7rem}
.act:hover:not(:disabled){border-color:var(--c);background:#1d2a45}
.act:disabled{opacity:.45;cursor:not-allowed}
.act b{display:block;font-weight:600}
.act .cost{float:right;font-size:.78rem;color:var(--dim);font-weight:400}
.act em{display:block;font-style:normal;color:var(--dim);font-size:.83rem;margin-top:.15rem}
.pol{--c:var(--pol)}.adv{--c:var(--adv)}.eye{--c:var(--eye)}
.grp{font-size:.8rem;font-weight:600;margin-top:.5rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;margin:.5rem 0}
.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.6rem}
.row label{display:flex;justify-content:space-between;font-size:.88rem}
.row label span{color:var(--dim)}
.log .day{font-family:var(--serif);margin:1.1rem 0 .3rem;color:var(--dim)}
.log p{margin:.2rem 0;padding-left:.9rem;border-left:2px solid var(--line);font-size:.92rem}
.log p.bad{border-color:var(--bad)}.log p.good{border-color:var(--good)}.log p.event{border-color:var(--pol)}.log p.lesson{border-color:var(--eye)}.log p.rumor{border-color:#6b5a8a;color:#c4bce0}
.muted{color:var(--dim)}
.over{position:fixed;inset:0;background:rgba(5,8,16,.88);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:9}
.over .card{max-width:520px;padding:1.4rem}
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:.4rem}
  nav button{border-left:0;border-bottom:3px solid transparent;white-space:nowrap;border-radius:6px 6px 0 0}
  nav button.on{border-bottom-color:var(--c,var(--text))}
  nav small,nav .sp{display:none}
  .top{flex-wrap:wrap;gap:.6rem}
  main{padding:1rem}
}
@media(prefers-reduced-motion:reduce){.top.flash::after{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   STORM CITY — a living-world simulation of the Cloud Kingdom
   One shared world. Three lenses. Time moves only when you act.
   ============================================================ */

// ---------- utilities ----------
let W=null;                       // the world
const UI={tab:'city',open:null,report:[],flash:false,intro:true};
const SAVE='stormcity-world-v1';
const $=s=>document.querySelector(s);
function rnd(){W.seed=(W.seed+0x6D2B79F5)|0;let t=W.seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}
const ri=(a,b)=>Math.floor(a+rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
function wpick(items,wf){const ws=items.map(i=>Math.max(0,wf(i)));const tot=ws.reduce((a,b)=>a+b,0);if(tot<=0)return pick(items);let r=rnd()*tot;for(let i=0;i<items.length;i++){r-=ws[i];if(r<=0)return items[i]}return items[items.length-1]}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0)/4294967296}
const dayOf=t=>Math.floor(t/2)+1, halfOf=t=>t%2?'Afternoon':'Morning';
const add=(k,v)=>{if(k==='gold')W.gold+=v;else if(k==='pop')W.pop=clamp(W.pop+v,0,200);else W[k]=clamp(W[k]+v)};
const fadd=(f,v)=>{W.fac[f].rel=clamp(W.fac[f].rel+v,-100,100)};
const drift=(k,target,rate)=>{W[k]=clamp(W[k]+(target-W[k])*rate)};
function log(text,cat='news'){W.log.unshift({t:W.t,text,cat,seq:++W.seq});if(W.log.length>500)W.log.length=500}

// ---------- static content ----------
const LOCS=['the Nimbus Gate','the Upper Ring','the Middle Ring','the Lower Ring','the Skydocks','the Ley-Wells','the Undercloud Market','the Grain Lifts','the Registry'];
const FAC=[
 {id:'mer',name:"Merchants' League",short:'Merchants',about:'Run the caravans and the Nimbus Gate trade. They pay the taxes and resent inspections.'},
 {id:'grd',name:'Cloud Guard',short:'Cloud Guard',about:'The Defense Force. Keeps order, and grows more political every time order slips.'},
 {id:'arc',name:'Free Arcanists',short:'Arcanists',about:'Independent mages who tend the ley-lines. Brilliant, proud, and not on your payroll.'},
 {id:'sky',name:"Skyfarmers' Union",short:'Skyfarmers',about:'Grow the food that floats. Little power until the day they stop delivering it.'}];
const FN=Object.fromEntries(FAC.map(f=>[f.id,f.short]));
const LN={pol:'Politics',adv:'Adventure',eye:'The Eye'};
const LCOL={pol:'var(--pol)',adv:'var(--adv)',eye:'var(--eye)'};

const CAUSE={
 crime:{n:'Organised crime',clue:'a crew with local protection working after dark',lesson:'Visible security shapes behaviour, but crime displaced is not crime solved.'},
 corruption:{n:'Corruption in the offices',clue:'permits and inspections that moved for a price',lesson:'Insider risk: without audit trails and separation of duties, trusted systems quietly rot.'},
 infra:{n:'Failing infrastructure',clue:'worn towers, lifts and relays past their service life',lesson:'Deferred maintenance compounds. Redundancy and upkeep are cheaper before the outage than after it.'},
 config:{n:'A bad change',clue:'a recent change that nobody tested properly',lesson:'Most outages follow a change. Change control, staged rollouts and fast rollback are infrastructure too.'},
 attack:{n:'Hostile intrusion',clue:'traces of someone probing from outside',lesson:'You cannot stop what you cannot see. Detection and containment matter as much as the wall.'},
 blacksky:{n:'Black Sky',clue:'a black-lined cloak and coin with no known mint',lesson:'Threat actors exploit the weakest seam between systems: gaps in security, identity and oversight at once.'},
 faction:{n:'Faction manoeuvring',clue:'a faction quietly leaning on the outcome',lesson:'Stakeholders with competing incentives are part of the system. Ignore them and they route around you.'},
 magic:{n:'Unstable magic',clue:'ley-lines flickering out of tolerance',lesson:'Foundational platforms drift. Monitor the substrate, not just the services built on top.'},
 weather:{n:'Storm weather',clue:'a front rolling in off the Upper Cloud',lesson:'Some causes are environmental. Resilience means surviving what you cannot prevent.'},
 demand:{n:'Demand outgrowing capacity',clue:'more traffic than the system was built for',lesson:'Capacity planning: growth succeeds right up to the day it exceeds what the platform was sized for.'},
 identity:{n:'Forged credentials',clue:'permits that should not exist',lesson:'Identity is the new perimeter. Weak identity controls turn every other system into a target.'},
 beast:{n:'Cloud beasts',clue:'claw marks and shed scales along the lanes',lesson:'Sometimes the threat is simply the environment pushing back. Fix the cause, not only the symptom.'},
 opp:{n:'Opportunity'},noise:{n:'False alarm'}};
const REAL=Object.keys(CAUSE).filter(c=>c!=='opp'&&c!=='noise');
const pressure=()=>(W.trade*.5+W.pop*.5)-W.infra;
const CW={
 crime:()=>(100-W.sec)/25+.3, corruption:()=>W.corr/25+.2, infra:()=>(100-W.infra)/25+.3, config:()=>.6,
 attack:()=>.25+W.bs/50+(100-W.identity)/100, blacksky:()=>W.bs/20+.1, faction:()=>.5, magic:()=>(100-W.magic)/25+.1,
 weather:()=>.6, demand:()=>Math.max(0,pressure())/12+.2, identity:()=>(100-W.identity)/25+.1,
 beast:()=>(100-W.magic)/40+(100-W.sec)/90+.1, opp:()=>1, noise:()=>1};
const AFF={
 pol:{crime:.9,corruption:1,faction:1,demand:.6,weather:.5,identity:.4,blacksky:.4,infra:.3,config:.1,attack:.1,magic:.2,beast:.3},
 adv:{beast:1,blacksky:.9,crime:.8,magic:.8,faction:.4,weather:.4,attack:.2,corruption:.3,infra:.2,config:.05,demand:.15,identity:.2},
 eye:{infra:1,config:1,attack:1,identity:1,demand:.9,magic:.5,blacksky:.3,weather:.4,crime:.15,corruption:.35,faction:.05,beast:.05}};
const SRC={pol:'Your informants say',adv:'Scouts report',eye:"The Eye's traces show"};

// ---------- event templates ----------
const TPL=[
{k:'shipments',type:'t',sys:['trade','support'],title:e=>`Shipments vanishing near ${e.loc}`,w:()=>1+(100-W.sec)/40+W.corr/60+W.bs/80,
 causes:['crime','corruption','infra','blacksky','faction','identity'],dur:[4,8],next:['dispute',null],
 fx:s=>{add('trade',-.9*s);add('gold',-1.6*s);add('support',-.3*s)},
 pol:e=>`Merchants at ${e.loc} demand to know why cargo keeps going missing.`,
 adv:e=>`Contract board: freight lost around ${e.loc}. No suspects; caravan masters are nervous.`,
 eye:e=>`Manifest scans near ${e.loc} do not reconcile with gate logs.`,
 ign:'More cargo is lost, trade slows, the treasury bleeds and the merchants turn on you.',
 resp:['patrol','negotiate','audit','relief','hire','repair','revoke']},
{k:'portal',type:'t',sys:['magic','trade','sec'],title:e=>`Unstable portal at ${e.loc}`,w:()=>.4+(100-W.magic)/30+W.bs/80,
 causes:['magic','blacksky','infra','attack'],dur:[3,6],next:['outage','magic'],
 fx:s=>{add('magic',-.5*s);add('trade',-.5*s);add('sec',-.3*s)},
 pol:e=>`Merchants want the portal at ${e.loc} secured or shut. Nobody wants to be the one who shuts it.`,
 adv:e=>`Contract: investigate the shimmering portal at ${e.loc}. Two porters have not come back.`,
 eye:e=>`Gate telemetry at ${e.loc}: phase jitter beyond tolerance, handshakes failing.`,
 ign:'Magic stability erodes, the portal disrupts trade, and something may come through.',
 resp:['negotiate','patrol','hire','arcane','contain','repair']},
{k:'outage',type:'t',sys:['net','trade'],title:e=>`Network outage in ${e.loc}`,w:()=>1+(100-W.infra)/30+Math.max(0,pressure())/10,
 causes:['infra','demand','config','attack','weather'],dur:[3,6],next:['shipments','infra'],
 fx:s=>{add('net',-1*s);add('trade',-.8*s);add('gold',-.8*s);add('support',-.25*s)},
 pol:e=>`Shops in ${e.loc} cannot confirm payments or gate passes.`,
 adv:e=>`Couriers report dead relay towers near ${e.loc}; caravans stalled on the lanes.`,
 eye:e=>`Alert: relay mesh at ${e.loc} dropping packets, routes flapping.`,
 ign:'Repeated outages cost merchants real money, then the political pressure follows.',
 resp:['relief','repair','rollback','contain','scale','failover']},
{k:'shortage',type:'t',sys:['food','support'],title:e=>`Food shortage in ${e.loc}`,w:()=>Math.max(.15,(60-W.food)/14),
 causes:['weather','demand','faction','infra','blacksky'],dur:[4,7],next:['unrest',null],
 fx:s=>{add('food',-1.2*s);add('support',-.8*s);add('stab',-.3*s)},
 pol:e=>`Queues at the grain lifts in ${e.loc}, and rumours of hoarding.`,
 adv:e=>`Skyfarm convoys are overdue near ${e.loc}. The lanes may not be safe.`,
 eye:e=>`Grain-lift scheduling at ${e.loc} shows stalled cargo bays and unreconciled counts.`,
 ign:'Hunger turns into anger quickly. Expect unrest.',
 resp:['relief','negotiate','patrol','audit','hire','repair']},
{k:'crime',type:'t',sys:['sec','support'],title:e=>`Smuggling ring active in ${e.loc}`,w:()=>.5+(100-W.sec)/30,
 causes:['crime','corruption','identity','blacksky'],dur:[4,8],next:['bsc','blacksky'],
 fx:s=>{add('sec',-.8*s);add('support',-.5*s);add('gold',-.7*s)},
 pol:e=>`Shopkeepers in ${e.loc} are paying "protection" and blaming the Steward.`,
 adv:e=>`Contract: unmarked crates moving through ${e.loc} at night.`,
 eye:e=>`Gate tallies show cargo weights that never match declared goods near ${e.loc}.`,
 ign:'Crime entrenches, public concern grows, and the Guard will demand more power.',
 resp:['patrol','audit','negotiate','hire','revoke','contain']},
{k:'fraud',type:'t',sys:['gold','trade'],title:()=>'Forged gate permits in circulation',w:()=>.3+(100-W.identity)/30+W.corr/80,
 causes:['identity','corruption','attack','blacksky'],dur:[4,7],next:['crime','identity'],
 fx:s=>{add('gold',-1.5*s);add('trade',-.4*s);add('sec',-.3*s)},
 pol:()=>'Customs officers find permits that look perfect and are not.',
 adv:()=>'Contract: a gang selling passes at the Skydocks. Buyers have no idea who the sellers are.',
 eye:()=>'Credential issuance logs show duplicate permit IDs and impossible-travel records.',
 ign:'Fraud drains the treasury and lets dangerous people through the gates.',
 resp:['audit','patrol','hire','revoke','contain']},
{k:'beast',type:'t',sys:['sec','pop'],title:e=>`Cloud beasts near ${e.loc}`,w:()=>.3+(100-W.magic)/35+(100-W.sec)/100,
 causes:['beast','magic'],dur:[3,6],next:['shipments',null],
 fx:s=>{add('sec',-.7*s);add('pop',-.15*s);add('trade',-.4*s)},
 pol:e=>`Residents near ${e.loc} want the Guard out there. The Guard wants more funds.`,
 adv:e=>`Contract: something large is hunting along the lanes near ${e.loc}.`,
 eye:e=>`Ley-sensors near ${e.loc} read heavy, irregular disturbances.`,
 ign:'Travel gets deadlier, trade routes close, people leave.',
 resp:['patrol','relief','hire','arcane']},
{k:'data',type:'t',sys:['gold','trade','stab'],title:()=>'Registry records corrupted',w:()=>.3+(100-W.infra)/60,
 causes:['infra','config','attack','magic'],dur:[3,6],next:['fraud',null],
 fx:s=>{const m=1-W.backup/130;add('gold',-1.2*s*m);add('trade',-.4*s*m);add('stab',-.3*s)},
 pol:()=>'Deeds, tariffs and permits cannot be found. Everyone suspects someone.',
 adv:()=>'Contract: guard the Registry vault while clerks sort out what is left.',
 eye:()=>'Storage checksums are failing across the Registry volumes.',
 ign:'The longer records stay broken, the more it costs. Good backups would soften this.',
 resp:['failover','rollback','contain','repair','audit']},
{k:'dispute',type:'t',sys:['stab','support'],title:e=>`${FN[e.f[0]]} and ${FN[e.f[1]]} at odds`,w:()=>.35+FAC.filter(f=>W.fac[f.id].rel<-10).length*.5,
 causes:['faction','corruption','demand'],dur:[4,8],next:['unrest',null],
 init:e=>{const a=wpick(FAC,f=>1+(100-W.fac[f.id].rel)/80).id;e.f=[a,pick(FAC.filter(f=>f.id!==a)).id]},
 fx:(s,e)=>{add('stab',-.8*s);add('support',-.3*s);fadd(e.f[0],-.6);fadd(e.f[1],-.6)},
 pol:e=>`The ${FN[e.f[0]]} and the ${FN[e.f[1]]} are trading public accusations.`,
 adv:e=>`Rival adventuring crews, one tied to each faction, are brawling in ${e.loc}.`,
 eye:e=>`Access-control requests from both factions are escalating. Someone wants a bigger key.`,
 ign:'The Council of Rings loses patience. Stability falls.',
 resp:['negotiate','audit','relief','patrol']},
{k:'unrest',type:'t',sys:['stab','support'],title:e=>`Protests in ${e.loc}`,w:()=>Math.max(0,(50-W.support)/12),
 causes:['demand','faction','weather','corruption','crime'],dur:[3,6],
 fx:s=>{add('stab',-1*s);add('support',-.3*s);add('sec',-.3*s)},
 pol:e=>`Crowds in ${e.loc} are demanding answers, loudly.`,
 adv:e=>`Contract: protect a notary caught between marchers and the Guard in ${e.loc}.`,
 eye:e=>`Public queue-counters near ${e.loc} report crowds well past normal.`,
 ign:'Crowds turn to riots; stability can fail quickly.',
 resp:['relief','negotiate','patrol','audit']},
{k:'bsc',type:'t',sys:['sec'],title:e=>`Black Sky couriers seen in ${e.loc}`,w:()=>W.bs<30?0:(W.bs-25)/15,
 causes:['blacksky'],dur:[4,8],
 fx:s=>{add('bs',1.2*s);add('sec',-.4*s);add('corr',.3*s)},
 pol:e=>`A merchant in ${e.loc} swears she saw a courier in a black-lined cloak.`,
 adv:e=>`Contract: tail a courier with no registered employer in ${e.loc}.`,
 eye:e=>`Encrypted traffic with no known signing authority is crossing ${e.loc}.`,
 ign:'Black Sky digs in deeper. Every other problem gets harder to solve.',
 resp:['patrol','audit','hire','contain','revoke']},
{k:'boom',type:'o',sys:['trade'],title:e=>`Trade boom at ${e.loc}`,w:()=>W.trade>45&&W.stab>40?(W.trade-40)/25:0,
 causes:['opp'],dur:[3,5],
 fx:s=>{add('trade',.5*s);add('gold',1.2*s)},reward:f=>{add('trade',6*f);add('gold',30*f);add('pop',2*f);fadd('mer',5*f)},
 pol:e=>`Caravans are queueing to reach ${e.loc}. A trade fair could lock this in.`,
 adv:e=>`Merchants are posting extra escort contracts around ${e.loc}.`,
 eye:e=>`Traffic through ${e.loc} is far above baseline. Capacity will be tested.`,
 ign:'The surge fades. More traffic also means more load on a network that may not be ready.',
 resp:['fair','negotiate']},
{k:'artifact',type:'o',sys:['magic'],title:e=>`Skyvault artifact surfaced near ${e.loc}`,w:()=>.35+(W.magic<50?.3:0)+W.bs/150,
 causes:['opp'],dur:[3,5],
 reward:f=>{add('magic',4*f);add('gold',40*f);add('rep',4*f);add('intel',4*f)},

function snapshot(){return{pop:W.pop,food:W.food,gold:W.gold,trade:W.trade,support:W.support,stab:W.stab,sec:W.sec,infra:W.infra,net:W.net,identity:W.identity,mon:W.mon,backup:W.backup,magic:W.magic}}
function newGame(){
  W={seed:Math.floor(Math.random()*2147483647),t:0,over:null,log:[],seq:0,events:[],contracts:[],pending:[],mods:[],nextId:1,notes:{},hist:[],low:0,corrIntel:0,kn:{backup:-99,identity:-99}};
  const v=(a,b)=>ri(a,b);
  Object.assign(W,{pop:v(30,90),food:v(30,75),gold:v(120,320),trade:v(25,75),support:v(35,70),stab:v(35,75),sec:v(20,75),infra:v(25,75),identity:v(15,65),mon:v(10,60),backup:v(10,60),magic:v(25,80),bs:v(5,50),corr:v(10,50),intel:v(5,25),rep:v(5,40),ready:80,party:1,patrol:50});
  W.net=clamp(W.infra+v(-12,12));
  W.fac={};FAC.forEach(f=>W.fac[f.id]={power:v(25,80),rel:v(-30,40),known:-99});
  W.prev=snapshot();
  const n=ri(2,3);for(let i=0;i<n;i++)spawnEvent(true);
  for(let i=0;i<3;i++)spawnContract();
  UI.tab='city';UI.open=null;UI.intro=true;UI.report=[];
  log('You take up the Steward\'s seal. Storm City is already in motion.','news');
  briefing();
  save();
}
function briefing(){
  const tr=[['trade','economy'],['infra','infrastructure'],['sec','security'],['magic','magic stability'],['food','food supply'],['stab','political stability']];
  const hi=tr.slice().sort((a,b)=>W[b[0]]-W[a[0]])[0], lo=tr.slice().sort((a,b)=>W[a[0]]-W[b[0]])[0];
  const pw=FAC.slice().sort((a,b)=>W.fac[b.id].power-W.fac[a.id].power)[0];
  log(`Your predecessor's note: ${hi[1]} is the strong suit; ${lo[1]} is the worry. The ${pw.name} carries the most weight on the Council.`,'news');
}

// ---------- events ----------
function spawnEvent(initial,key,cause){
  if(W.events.length>=8)return null;
  const act=k=>W.events.filter(e=>e.k===k).length;
  const T=key?tpl(key):wpick(TPL.filter(t=>t.w()>0),t=>t.w()*(act(t.k)?.2:1));
  const c1=cause||wpick(T.causes,c=>CW[c]());
  const causes=[c1];
  if(!cause&&T.causes.length>1&&rnd()<.3)causes.push(wpick(T.causes.filter(c=>c!==c1),c=>CW[c]()));
  const e={id:W.nextId++,k:T.k,loc:pick(LOCS),causes,sev:T.type==='t'&&rnd()<.25?2:1,age:0,dur:ri(T.dur[0],T.dur[1]),born:W.t,detected:false,clues:{},secDone:false};
  if(T.init)T.init(e);
  e.detected=initial?rnd()<.6:rnd()<.3+W.mon*.004;
  W.events.push(e);
  if(e.detected)announce(e);
  return e;
}
function announce(e,late){const T=tpl(e.k);log(`Reported: ${T.title(e)}.${late?' It has been going on for some time.':''}`,'event')}
function eventsTick(){
  for(const e of W.events.slice()){
    const T=tpl(e.k);e.age++;T.fx(e.sev,e);
    if(!e.detected){const p=.1+W.mon*.004+e.sev*.08;if(rnd()<p){e.detected=true;announce(e,W.t-e.born>=3)}}
    if(T.type==='t'){
      if(e.age>=e.dur){e.age=0;if(e.sev<5){e.sev++;if(e.detected)log(`${T.title(e)} has grown worse.`,'bad')}
        if(e.sev>=3&&T.next&&rnd()<.5&&W.events.length<8){const n=spawnEvent(false,T.next[0],T.next[1]);if(n&&n.detected)log('The trouble is spreading.','bad')}}
      else if(e.sev===1&&rnd()<.08){remove(e);if(e.detected)log(`${T.title(e)} seems to have settled on its own.`,'news')}
    }else if(T.type==='o'){
      if(e.age>=e.dur){remove(e);if(e.detected){log(`The chance passed: ${T.title(e)}.`,'news')}if(T.expire)T.expire()}
    }else if(e.age>=e.dur){remove(e)}
  }
}
const remove=e=>{W.events=W.events.filter(x=>x!==e)};
function resolveLessons(e){
  const names=e.causes.map(c=>CAUSE[c].n).join(' and ');
  log(`Post-mortem: it was ${names}.`,'lesson');
  e.causes.forEach(c=>{if(CAUSE[c].lesson&&!W.notes[c]){W.notes[c]=W.t;log(`Field note — ${CAUSE[c].n}: ${CAUSE[c].lesson}`,'lesson')}});
}

function passive(){
  const f=W.fac,sev=W.events.reduce((a,e)=>a+(e.sev),0),p=pressure();
  add('infra',-.25);add('identity',-.15);add('mon',-.2);add('backup',-.12);
  drift('trade',10+.3*W.infra+.2*W.net+.2*W.sec+.12*W.stab+.12*(f.mer.rel+100)/2,.08);
  drift('sec',15+.4*W.patrol+.15*f.grd.power+.12*W.identity-.2*W.bs-.12*W.corr,.07);
  drift('net',20+.55*W.infra+.15*W.mon-Math.max(0,p)*.3,.1);
  drift('food',35+.3*f.sky.power+.15*W.trade+.1*W.infra-.25*W.pop,.05);
  drift('support',15+.25*W.food+.2*W.sec+.15*W.trade+.1*W.stab-sev*.8,.08);
  const avgRel=(f.mer.rel+f.grd.rel+f.arc.rel+f.sky.rel)/4;
  drift('stab',20+.35*W.support+.15*W.sec+.2*(avgRel+100)/2-.15*W.corr,.07);
  drift('magic',20+.25*f.arc.power+.2*(f.arc.rel+100)/2+.15*W.infra-.3*W.bs,.03);
  drift('bs',8+.3*(100-W.sec)+.3*W.corr+.1*(100-W.identity),.03);
  drift('corr',15+.2*(100-W.stab)+.12*(100-W.mon)+.1*f.mer.power,.02);
  add('pop',(W.food-45)*.012+(W.support-45)*.01+(W.trade-45)*.008-Math.max(0,p)*.02+(rnd()-.5)*.1);
  add('gold',.3*W.trade+.1*W.pop-(.06*W.infra+.08*W.patrol+.03*W.mon+.02*W.backup));
  add('intel',-.15);W.corrIntel=clamp(W.corrIntel-.3);
  for(const id in f){f[id].rel*=.99}
  f.grd.power=clamp(f.grd.power+(W.patrol-50)*.003+(50-W.sec)*.002);
  f.mer.power=clamp(f.mer.power+(W.trade-50)*.003);
  f.sky.power=clamp(f.sky.power+(W.food<35?.2:0)-(W.food>65?.1:0));
  if(W.gold<0){add('support',-.8);add('stab',-.4)}
}
function chatter(){
  if(rnd()>.33)return;
  const o=[],tr=[];
  if(W.sec<45)o.push('The Cloud Guard petitions the Steward for added patrol funding.');
  if(W.trade<40)o.push("The Merchants' League asks for lower gate tariffs and safer routes.");
  if(W.magic<45)o.push('The Free Arcanists warn that the ley-lines are fraying.');
  if(W.food<45)o.push("The Skyfarmers' Union hints that grain prices must rise.");
  if(W.corr>50)tr.push('Whispers say gate permits are being sold for silver in the Lower Ring.');
  if(W.bs>45)tr.push('A drunk skysailor swears he saw a black-lined cloak on the docks.');
  if(W.infra<35)tr.push('Old relay towers are humming wrong at night.');
  if(W.identity<30)tr.push('A clerk admits the permit seals are barely checked anymore.');
  if(W.backup<25)tr.push('A registry archivist grumbles that nobody has tested the old vault in years.');
  const red=['A peddler claims the aurora over the Nimbus Gate has dimmed.','Someone says the Guard captain sells patrol schedules.','A rumour: the Arcanists are hoarding storm-glass.','A caravan master blames "bad cloud" for everything.'];
  if(tr.length&&rnd()<.55)log(pick(tr),'rumor');
  else if(o.length&&rnd()<.6)log(pick(o),'faction');
  else log(pick(red),'rumor');
}

function spawnContract(){
  const C=wpick(CT,c=>c.w());const risk=Math.max(1,Math.min(5,C.risk+(rnd()<.2?1:0)));
  const loc=pick(LOCS);
  W.contracts.push({id:W.nextId++,k:C.k,title:C.title,loc,risk,gold:15+risk*8+ri(0,10),expires:W.t+ri(5,10),desc:C.d(loc)});
}
function contractsTick(){
  W.contracts=W.contracts.filter(c=>c.expires>W.t);
  if(W.contracts.length<5&&rnd()<.45)spawnContract();
}

// ---------- the clock ----------
function tick(){
  W.t++;
  W.pending=W.pending.filter(p=>{if(W.t>=p.at){p.fn();return false}return true});
  W.mods=W.mods.filter(m=>{for(const k in m.fx)add(k,m.fx[k]);if(W.t>=m.until){log(m.end,'news');return false}return true});
  passive();eventsTick();
  const n=W.events.length;let p=clamp(.42-n*.04,.1,.5);
  if(rnd()<p)spawnEvent(false);
  chatter();contractsTick();
  W.hist.push(snapshot());if(W.hist.length>6)W.hist.shift();
  checkEnd();
}
function checkEnd(){
  W.low=W.stab<=6?W.low+1:0;
  let o=null;
  if(W.low>=3)o={title:'The Council votes you out',text:'Order has broken down. The Council of Rings has chosen a new Steward, and nobody asked you.'};
  else if(W.pop<8)o={title:'Storm City empties',text:'The last ferries have left. A city needs people more than it needs a Steward.'};
  else if(W.gold<-150)o={title:'The creditors take the treasury',text:'The Sky Banks have sealed the vaults. You are still Steward in name only.'};
  if(o){W.over=o;log(o.title+'.','bad')}
}
function spend(slots,fn){
  if(W.over)return;
  const start=W.seq;W.prev=snapshot();UI.intro=false;
  fn();
  for(let i=0;i<slots&&!W.over;i++)tick();
  UI.report=W.log.filter(l=>l.seq>start).reverse();UI.flash=true;
  save();render();
}
function project(delay,label,fn){W.pending.push({at:W.t+delay+1,label,fn})}
function mod(label,until,fx,end){W.mods.push({label,until:W.t+until,fx,end})}

function agenda(id){
  return {mer:W.trade<45?'They want lower tariffs and safer routes.':'They want steady growth and lenient inspections.',
   grd:W.sec<45?'They want more funding and wider powers.':'They want their influence recognised.',
   arc:W.magic<45?'They want custody of the ley-wells to repair them.':'They want freedom from licensing.',
   sky:W.food<45?'They want grain price supports.':'They want the lanes kept safe.'}[id];
}
function addClue(e,lens,real){
  const aff=AFF[lens];let c;
  if(real)c=wpick(e.causes,c=>aff[c]||.15);else c=wpick(REAL,c=>aff[c]||.1);
  e.clues[c]=(e.clues[c]||0)+1;if(c==='blacksky')add('intel',4);
  return c;
}
G={};
G.tab=t=>{UI.tab=t;UI.open=null;render()};
G.open=id=>{UI.open=UI.open===id?null:id;render()};
G.wait=()=>spend(1,()=>log('You wait and watch.','action'));
G.dismiss=()=>{UI.report=[];UI.intro=false;render()};
G.new=()=>{if(!W.over&&!confirm('Abandon this city and generate a new world?'))return;newGame();render()};
G.act=id=>{const a=ACT.find(x=>x.id===id);if(!a||W.gold<a.gold||(a.can&&!a.can()))return;spend(a.slots,()=>{add('gold',-a.gold);a.run()})};
G.inv=(id,lens)=>{
  const e=W.events.find(x=>x.id===id);if(!e)return;const cost={pol:4,adv:8,eye:3}[lens];if(W.gold<cost)return;
  spend(1,()=>{
    add('gold',-cost);const T=tpl(e.k);
    if(e.k==='noise'){remove(e);log('You looked into it: a false alarm.','action');if(lens==='eye'){add('mon',1)}return}
    if(lens==='adv')add('ready',-4);
    const base=lens==='eye'?.4+W.mon*.004:lens==='adv'?.4+W.rep*.003+(W.ready-50)*.002:.38+(W.stab-40)*.002;
    const real=rnd()<base,c=addClue(e,lens,real);
    log(`${SRC[lens]} ${CAUSE[c].clue}. (${T.title(e)}) ${real&&rnd()<.0?'':''}`.trim(),'event');
  });
};
G.resp=(id,key)=>{
  const e=W.events.find(x=>x.id===id),R=RESP[key];if(!e||W.gold<R.gold)return;
  if(key==='hire'&&W.ready<20)return;
  spend(R.slots,()=>{
    const T=tpl(e.k);add('gold',-R.gold);R.side(e);
    const m=Math.max(...e.causes.map(c=>R.match[c]||.12));
    const p=clamp(m*.85+.08+(R.bonus?R.bonus(e):0),.05,.95);
    if(rnd()<p){
      if(T.type==='o'){const f=R.full?1:.55;T.reward(f);remove(e);log(`${R.name} paid off: ${T.title(e)} was seized.`,'good');if(key==='hire')add('rep',3);return}
      const amt=m>=.8&&e.sev>1&&rnd()<.5?2:1;
      if(e.causes.length>1&&(R.match[e.causes[1]]||0)>=.5)e.secDone=true;
      e.sev-=amt;
      if(m>=.55){const best=e.causes.slice().sort((a,b)=>(R.match[b]||0)-(R.match[a]||0))[0];e.clues[best]=(e.clues[best]||0)+1}
      if(e.causes.length>1&&!e.secDone&&e.sev<1){e.sev=1;log(`${R.name} helped, but something else is still driving ${T.title(e)}.`,'event')}
      else if(e.sev<1){remove(e);log(`${R.name} resolved: ${T.title(e)}.`,'good');resolveLessons(e);if(key==='hire')add('rep',3)}
      else log(`${R.name} brought ${T.title(e)} under better control.`,'good');
    }else{
      if(R.onFail)R.onFail(e);
      if(m<.3&&rnd()<.3&&T.type==='t')e.sev=Math.min(5,e.sev+0);
      log(`${R.name} made little difference to ${T.title(e)}.`,'bad');
    }
  });
};
G.take=id=>{
  const c=W.contracts.find(x=>x.id===id);if(!c||W.ready<20)return;
  spend(2,()=>{
    const C=CT.find(x=>x.k===c.k);W.contracts=W.contracts.filter(x=>x!==c);
    const p=clamp(.8-c.risk*.1+(W.ready-60)*.004+(W.party-1)*.05+W.rep*.0015,.1,.95),r=rnd();
    if(r<p*.75){applyFx(C.ok,1);add('gold',c.gold);add('rep',c.risk+1);add('ready',-c.risk*4);log(`Contract complete: ${c.title} (${c.loc}). The party returns in good order.`,'good');if(C.clue)revealByContract()}
    else if(r<p){applyFx(C.ok,.5);add('gold',c.gold/2);add('rep',1);add('ready',-c.risk*6);log(`Contract partly done: ${c.title} (${c.loc}). Some of it went wrong.`,'event')}
    else{applyFx(C.fail,1);add('rep',-3);add('ready',-c.risk*9);if(rnd()<.35)W.party=Math.max(1,W.party-.5);log(`Contract failed: ${c.title} (${c.loc}). The party limps home, and word gets around.`,'bad')}
  });
};
function revealByContract(){
  const e=pick(W.events.filter(x=>x.k!=='noise'));if(!e){add('intel',3);return}
  if(!e.detected){e.detected=true;announce(e,true)}
  addClue(e,'adv',true);log(`The party brought back evidence concerning ${tpl(e.k).title(e)}.`,'event');
}

// ---------- persistence ----------
function save(){try{localStorage.setItem(SAVE,JSON.stringify(W))}catch(_){}}
function load(){try{const s=localStorage.getItem(SAVE);if(!s)return false;W=JSON.parse(s);W.kn=W.kn||{backup:-99,identity:-99};UI.intro=W.t===0;return !!W.fac}catch(_){return false}}

// ---------- rendering ----------
const SCALE=['Collapsing','Failing','Strained','Steady','Strong','Thriving'];
const wd=(v,a=SCALE)=>a[Math.min(a.length-1,Math.max(0,Math.floor(v/(100/a.length))))];
const nz=k=>hash(k+':'+W.t)*2-1;
function est(v,sd,k){return Math.round(clamp(v+nz(k)*sd))}
function trend(k){const d=W[k]-W.prev[k],th=k==='gold'?5:1.5;return d>=th?'<span class="tr up">▲</span>':d<=-th?'<span class="tr dn">▼</span>':''}
function chip(label,k,col){return `<div class="chip" style="--c:${col}"><label>${label}</label>${trend(k)}<b>${k==='gold'?Math.round(W.gold):wd(W[k])}</b>${k==='gold'?'':`<div class="bar"><i style="width:${W[k]}%"></i></div>`}</div>`}
function pulse(){return `<div class="pulse">${chip('Treasury','gold','var(--pol)')}${chip('Food','food','var(--good)')}${chip('Trade','trade','var(--pol)')}${chip('Public support','support','var(--pol)')}${chip('Stability','stab','var(--pol)')}${chip('Security','sec','var(--adv)')}${chip('Network','net','var(--eye)')}</div>`}
function btn(cls,name,cost,desc,onclick,dis){return `<button class="act ${cls}" ${dis?'disabled':''} onclick="${onclick}"><b>${name}<span class="cost">${cost}</span></b><em>${desc}</em></button>`}
function suspects(e){
  if(e.k==='noise')return '<p>Most likely nothing. Someone has to look to be sure.</p>';
  const cl=Object.entries(e.clues).sort((a,b)=>b[1]-a[1]);
  if(!cl.length)return `<p class="muted">No leads yet. ${e.detected?'You only see the symptoms.':''} Investigate to learn more.</p>`;
  const strong=cl[0][1]>=2&&(!cl[1]||cl[0][1]>cl[1][1]);
  return `<div class="sus">${cl.slice(0,3).map(([c,n])=>`<span>${CAUSE[c].n}<em>${'●'.repeat(Math.min(3,n))}${'○'.repeat(Math.max(0,3-n))}</em></span>`).join('')}</div><p class="muted">${strong?'The evidence is building in one direction, though leads can mislead.':'The leads do not agree yet. Some may be misleading.'}</p>`;
}
function evCard(e,lens){
  const T=tpl(e.k),open=UI.open===e.id,lead=T[lens||'pol'](e);
  const pips=[1,2,3,4,5].map(i=>`<i class="${i<=e.sev?'f':''}"></i>`).join('');
  let h=`<article class="ev s${e.sev} ${T.type==='o'?'opp':''}"><button class="evh" onclick="G.open(${e.id})"><span class="pips">${pips}</span><span class="evt"><b>${T.title(e)}</b><i>${lead}</i></span><span class="evm">${T.type==='o'?'opportunity':'since day '+dayOf(e.born)}</span></button>`;
  if(open){
    const ls=lens?[lens]:['pol','adv','eye'];
    const left=Math.max(1,e.dur-e.age);
    h+=`<div class="evb"><h4>What is happening</h4>${ls.map(l=>`<p class="ln ${l}"><b>${LN[l]}</b>${T[l](e)}</p>`).join('')}
    <h4>Why it might be happening</h4>${suspects(e)}
    <h4>If ignored</h4><p>${T.ign}${T.type==='t'?` It may worsen within about ${left>=2?Math.ceil(left/2)+' day'+(left>3?'s':''):'half a day'}.`:' This chance will not last.'}</p>
    <h4>What can be done</h4>`;
    for(const l of ls){
      const rs=T.resp.filter(k=>RESP[k].lens===l);
      h+=`<div class="grp" style="color:${LCOL[l]}">${LN[l]}</div><div class="acts">`;
      rs.forEach(k=>{const R=RESP[k];h+=btn(l,R.name,costTxt(R.gold,R.slots),R.desc,`G.resp(${e.id},'${k}')`,W.gold<R.gold||(k==='hire'&&W.ready<20))});
      const ic={pol:4,adv:8,eye:3}[l],iv={pol:['Question witnesses','Ask around and press officials for answers.'],adv:['Send scouts to the site','Eyes on the ground. Tiring for the party.'],eye:['Pull logs and traces','Follow the data. Better monitoring helps.']}[l];
      h+=btn(l,iv[0],costTxt(ic,1),iv[1],`G.inv(${e.id},'${l}')`,W.gold<ic||(l==='adv'&&false));
      h+='</div>';
    }
    h+='</div>';
  }
  return h+'</article>';
}
function sortedEvents(){return W.events.filter(e=>e.detected).sort((a,b)=>(b.sev-a.sev)||(a.born-b.born))}
function storyline(){
  const k=[['trade','Trade'],['food','Food'],['support','Public support'],['stab','Stability'],['sec','Security'],['net','The network']];
  const s=k.slice().sort((a,b)=>W[a[0]]-W[b[0]]);
  let h=`<p class="story">Storm City is ${wd(W.stab,['on the edge','fraying','uneasy','steady','confident','buoyant'])}. ${s[0][1]} is the weak point (${wd(W[s[0][0]]).toLowerCase()}); ${s[5][1].toLowerCase()} is holding up best.</p>`;
  const sysOf={trade:'trade',support:'support',sec:'security',food:'food',net:'network',magic:'magic'};
  const old=W.hist[0];
  if(old&&W.t>=3){
    for(const key of ['trade','support','sec','food','net','magic']){
      const explained=W.events.some(e=>e.detected&&tpl(e.k).sys.includes(key));
      if(old[key]-W[key]>=5&&!explained){h+=`<div class="odd">Something does not add up: ${sysOf[key]} has been sliding, and no report explains it. Look closer.</div>`;break}
    }
  }
  return h;
}
function actionsFor(lens){return ACT.filter(a=>a.lens===lens).map(a=>btn(lens,a.name,costTxt(a.gold,a.slots),a.desc,`G.act('${a.id}')`,W.gold<a.gold||(a.can&&!a.can()))).join('')}
function underway(){
  let h='';
  if(W.pending.length||W.mods.length){
    h+='<h3>Under way</h3><div class="card">';
    W.pending.forEach(p=>h+=`<p>${p.label} <span class="muted">· about day ${dayOf(p.at)}, ${halfOf(p.at).toLowerCase()}</span></p>`);
    W.mods.forEach(m=>h+=`<p>${m.label} <span class="muted">· until day ${dayOf(m.until)}, ${halfOf(m.until).toLowerCase()}</span></p>`);
    h+='</div>';
  }
  return h;
}
function bsWord(){const sd=30-W.intel*.25;return wd(est(W.bs,sd,'bs'),['No sign','Faint signs','Stirring','Active','Spreading','Everywhere'])}
function viewCity(){
  let h=`<h2>Current situation</h2>${storyline()}<h3>Events</h3>`;
  const ev=sortedEvents();
  h+=ev.length?ev.map(e=>evCard(e)).join(''):'<p class="muted">Nothing has been reported. That does not mean nothing is happening.</p>';
  h+=underway();
  h+='<h3>News and rumours</h3><div class="log">'+W.log.slice(0,6).map(l=>`<p class="${l.cat}">${l.text}</p>`).join('')+'</div>';
  return h;
}
function viewPol(){
  const ev=sortedEvents();
  let h=`<h2 style="color:var(--pol)">Politics</h2><p class="muted">The city as the Council and the factions see it.</p>`;
  h+=`<div class="rows"><div class="card row"><label>Public support<span>${wd(W.support)}</span></label><div class="bar" style="--c:var(--pol)"><i style="width:${W.support}%"></i></div></div><div class="card row"><label>Political stability<span>${wd(W.stab)}</span></label><div class="bar" style="--c:var(--pol)"><i style="width:${W.stab}%"></i></div></div><div class="card row"><label>Patrol presence<span>${wd(W.patrol,['Skeleton','Light','Visible','Heavy'])}</span></label><div class="bar" style="--c:var(--adv)"><i style="width:${W.patrol}%"></i></div></div><div class="card row"><label>Whispers of graft<span>${wd(est(W.corr,28-W.corrIntel*.2,'c'),['None heard','A little','Some','A lot','Rampant'])}</span></label><div class="bar"><i style="width:${est(W.corr,28-W.corrIntel*.2,'c')}%;background:var(--pol)"></i></div></div></div>`;
  h+='<h3>What the city is asking for</h3>'+(ev.length?ev.map(e=>evCard(e,'pol')).join(''):'<p class="muted">No petitions today.</p>');
  h+=underway();
  h+=`<h3>City decisions</h3><div class="acts">${actionsFor('pol')}</div>`;
  return h;
}
function viewAdv(){
  const ev=sortedEvents();
  const pl=['Ragged band','Small band','Seasoned company','Veteran company','Storied company'][Math.min(4,Math.floor(W.party)-1)];
  let h=`<h2 style="color:var(--adv)">Adventure</h2><p class="muted">The cloud lanes and everything that lives out there.</p>`;
  h+=`<div class="rows"><div class="card row"><label>Party readiness<span>${wd(W.ready,['Spent','Weary','Tired','Ready','Fresh'])}</span></label><div class="bar" style="--c:var(--adv)"><i style="width:${W.ready}%"></i></div></div><div class="card row"><label>Adventurer reputation<span>${wd(W.rep,['Unknown','Doubted','Known','Trusted','Famed'])}</span></label><div class="bar" style="--c:var(--adv)"><i style="width:${W.rep}%"></i></div></div><div class="card row"><label>Company<span>${pl}</span></label></div><div class="card row"><label>Word of Black Sky<span>${bsWord()}</span></label><p class="muted" style="font-size:.78rem">${W.intel<30?'Low confidence.':W.intel<60?'Moderate confidence.':'Good confidence.'}</p></div></div>`;
  h+='<h3>Contract board</h3>';
  h+=W.contracts.length?`<div class="acts">${W.contracts.map(c=>btn('adv',c.title,costTxt(c.gold,2),`${c.desc} Risk ${'▮'.repeat(c.risk)}${'▯'.repeat(5-c.risk)}. Posted until day ${dayOf(c.expires)}.`,`G.take(${c.id})`,W.ready<20)).join('')}</div>`:'<p class="muted">The board is empty.</p>';
  if(W.ready<20)h+='<p class="muted">The party needs rest before another contract.</p>';
  h+='<h3>Trouble out there</h3>'+(ev.length?ev.map(e=>evCard(e,'adv')).join(''):'<p class="muted">Nothing reported.</p>');
  h+=`<h3>Guild decisions</h3><div class="acts">${actionsFor('adv')}</div>`;
  return h;
}
function viewEye(){
  const ev=sortedEvents(),sd=14-W.mon*.12;
  const row=(label,k,unk)=>{const s=unk&&W.t-W.kn[k]>12?24:sd;const v=est(W[k],s,k);return `<div class="card row"><label>${label}<span>${unk&&W.t-W.kn[k]>12?`~${v} · unverified`:`~${v}`}</span></label><div class="bar" style="--c:var(--eye)"><i style="width:${v}%"></i></div></div>`};
  let h=`<h2 style="color:var(--eye)">The Eye</h2><p class="muted">Telemetry from the city's infrastructure. Readings are estimates; better monitoring tightens them.</p>`;
  h+=`<div class="rows">${row('Infrastructure','infra')}${row('Network reliability','net')}${row('Monitoring coverage','mon')}${row('Magic stability','magic')}${row('Identity controls','identity',1)}${row('Backup and recovery','backup',1)}</div>`;
  const p=pressure();
  h+=`<p class="muted" style="margin-top:.6rem">Load: ${p>12?'demand is running well past what the infrastructure was built for.':p>0?'activity is close to capacity.':'there is headroom.'}</p>`;
  h+='<h3>Alerts and anomalies</h3>'+(ev.length?ev.map(e=>evCard(e,'eye')).join(''):'<p class="muted">The dashboards are quiet. Quiet is not the same as healthy.</p>');
  h+=underway();
  h+=`<h3>Engineering decisions</h3><div class="acts">${actionsFor('eye')}</div>`;
  return h;
}
function viewFac(){
  let h='<h2>Factions</h2><p class="muted">Allies, rivals and pressure groups. Their moods shape what the city can bear.</p>';
  FAC.forEach(f=>{const x=W.fac[f.id],known=W.t-x.known<=8;
    const rel=wd((x.rel+100)/2,['Hostile','Cold','Wary','Neutral','Friendly','Devoted']);
    h+=`<div class="card"><b style="font-family:var(--serif);font-size:1.1rem">${f.name}</b><p class="muted">${f.about}</p><div class="rows"><div class="row"><label>Influence<span>${wd(x.power,['Marginal','Minor','Notable','Strong','Dominant'])}</span></label><div class="bar" style="--c:var(--pol)"><i style="width:${x.power}%"></i></div></div><div class="row"><label>Attitude toward you<span>${rel}</span></label><div class="bar" style="--c:var(--pol)"><i style="width:${(x.rel+100)/2}%"></i></div></div></div><p>${known?'<span class="muted">Agenda:</span> '+agenda(f.id):'<span class="muted">You have not spoken with them lately. Hold an audience to learn their current agenda.</span>'}</p></div>`;
  });
  return h;
}
function viewHist(){
  let h='<h2>History</h2><div class="log">',last=0;
  W.log.forEach(l=>{const d=dayOf(l.t);if(d!==last){last=d;h+=`<div class="day">Day ${d}</div>`}h+=`<p class="${l.cat}">${l.text}</p>`});
  h+='</div>';
  return h;
}
function render(){
  if(!W)return;
  const views={city:viewCity,pol:viewPol,adv:viewAdv,eye:viewEye,fac:viewFac,hist:viewHist};
  const nav=[['city','City','What is happening',null],['pol','Politics','Councils and factions','var(--pol)'],['adv','Adventure','Contracts and the lanes','var(--adv)'],['eye','The Eye','Infrastructure','var(--eye)'],['fac','Factions','',null],['hist','History','',null]];
  let banner='';
  if(UI.intro&&W.t===0)banner=`<div class="banner intro"><button class="x" onclick="G.dismiss()">Dismiss</button><p><b>Your first morning.</b> Time only moves when you act. Browse every section first; nothing here advances the clock.</p><p>Reports are symptoms. The cause may be hiding behind them. Politics, Adventure and The Eye are three views of the same city.</p></div>`;
  else if(UI.report.length)banner=`<div class="banner"><button class="x" onclick="G.dismiss()">Dismiss</button>${UI.report.map(l=>`<p>${l.text}</p>`).join('')}</div>`;
  const over=W.over?`<div class="over"><div class="card"><h2>${W.over.title}</h2><p>${W.over.text}</p><p class="muted">After ${dayOf(W.t)-1+(W.t%2?0:0)} full days, here is what you could not see: Black Sky was ${wd(W.bs,['dormant','quiet','stirring','active','spreading','everywhere'])}, graft was ${wd(W.corr,['rare','modest','common','heavy','rampant'])}, and identity controls were ${wd(W.identity,['non-existent','weak','patchy','decent','solid'])}.</p><p style="margin-top:1rem"><button class="btn primary" onclick="G.new()">Begin a new world</button></p></div></div>`:'';
  $('#app').innerHTML=`<header class="top ${W.t%2?'pm':''} ${UI.flash?'flash':''}"><div class="brand"><h1>Storm City</h1><span>The Steward's console · world ${Math.abs(W.seed0||W.seedStart||0)||''}</span></div><div class="clock"><b>Day ${dayOf(W.t)}</b><span>${halfOf(W.t)}</span></div><div class="purse"><b>${Math.round(W.gold)}</b><span>treasury</span></div><button class="btn primary" onclick="G.wait()">Let time pass</button></header>
  <div class="shell"><nav>${nav.map(n=>`<button class="${UI.tab===n[0]?'on':''}" style="--c:${n[3]||'var(--text)'}" onclick="G.tab('${n[0]}')">${n[1]}${n[2]?`<small>${n[2]}</small>`:''}</button>`).join('')}<div class="sp"></div><button onclick="G.new()">New world</button></nav>
  <main>${pulse()}${banner}${views[UI.tab]()}</main></div>${over}`;
  UI.flash=false;
}
// ---------- boot ----------
if(!load())newGame();
render();
</script>
</body>
</html>
