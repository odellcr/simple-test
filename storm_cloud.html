<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Storm City">
<meta name="theme-color" content="#101827">
<title>Storm City</title>
<style>
:root{--bg:#0b1020;--panel:#121a2b;--panel2:#18233a;--text:#e8edf7;--muted:#9eabc2;--accent:#7dd3fc;--good:#4ade80;--bad:#f87171;--gold:#facc15}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:#253453;color:white;font-weight:650;cursor:pointer;transition:background 0.2s,transform 0.1s}
button:hover{background:#32466d}
button:active{transform:translateY(1px)}
button.primary{background:#0369a1}
button.good{background:#166534}
button.warn{background:#92400e}
button.danger{background:#991b1b}
#app{max-width:1100px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}
.brand h1{margin:0;font-size:26px;letter-spacing:1px}
.brand small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid #26324a;border-radius:12px;padding:10px;transition:transform 0.2s}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-size:18px}
.stat span{font-size:11px;color:var(--muted);letter-spacing:0.5px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
nav button{background:#17223a}
nav button:hover{background:#1f2d4d}
nav button.active{background:#075985;box-shadow:inset 0 -3px 0 var(--accent)}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}
.panel{background:rgba(18,26,43,.96);border:1px solid #26324a;border-radius:14px;padding:14px}
.panel h2,.panel h3{margin:0 0 8px}
.muted{color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.stack>*+*{margin-top:8px}
.cards{display:grid;gap:9px}
.card{background:#18233a;border:1px solid #2a3854;border-radius:11px;padding:11px}
.card h3{margin:0 0 5px}
.card p{margin:5px 0;color:#c7d1e3}
.choices{display:grid;gap:7px;margin-top:9px}
.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#263453;color:#b9d9ff;font-size:11px;margin:2px}
.log{max-height:360px;overflow:auto;padding-right:5px}
.log div{padding:8px 0;border-bottom:1px solid #26324a;animation:fadeIn 0.3s ease-in}
.log div:last-child{border-bottom:none}
.goodtxt{color:var(--good)}
.badtxt{color:var(--bad)}
.gold{color:var(--gold)}
.hidden{display:none}
.meter{height:8px;background:#25304a;border-radius:99px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:#38bdf8;transition:width 0.4s ease-out}
.footer{color:var(--muted);font-size:11px;text-align:center;margin:14px}
@keyframes fadeIn { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; transform: translateX(0); } }
@media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}#app{padding:10px}.top{align-items:flex-start}.brand h1{font-size:23px}}
#iosHelp{display:none;background:#17233a;border:1px solid #365071;border-radius:12px;padding:11px;margin-bottom:12px;color:#dbeafe}
#iosHelp b{color:white} #iosHelp button{margin-top:8px;padding:8px 10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY="storm-city-save-v2";
const initial={
 year:427, day:1, mode:"IT", money:50000, population:50000, food:72, security:68,
 infrastructure:45, publicSupport:60, eyeRep:25, advRep:0, stability:62, trade:58,
 magic:70, blackSky:18, info:20, tech:20, politicalRep:20,
 factions:{
  "The Eye":50,"Government":50,"Storm Ledger":50,"Defense Force":50,"Black Sky":25
 },
 party:[
  {name:"Alden",role:"Warrior",hp:100,max:100,skill:55,xp:0,wealth:500},
  {name:"Mira",role:"Mage",hp:80,max:80,skill:60,xp:0,wealth:500},
  {name:"Vey",role:"Rogue",hp:85,max:85,skill:58,xp:0,wealth:500}
 ],
 partyRep:10, partyWealth:1500, level:"Bronze",
 itRank:"Junior Eye Employee", politicalRank:"Local Official",
 projects:[], completed:[], events:[], turn:1,
 log:["Year 427, Day 1 — Storm City is stable enough to begin. The Eye has assigned you a junior infrastructure portfolio."]
};

const modeData={
 IT:{title:"THE EYE",subtitle:"Infrastructure & Operations",intro:"Solve practical infrastructure problems. Every solution creates tradeoffs."},
 ADVENTURE:{title:"ADVENTURE",subtitle:"Contracts & Expeditions",intro:"Run a small adventuring party and turn information into action."},
 POLITICAL:{title:"POLITICS",subtitle:"Storm City Government",intro:"Manage the city while balancing factions, resources and public support."}
};

const itEvents=[
 {t:"Nimbus Site Connectivity",d:"A remote Eye facility needs reliable connectivity. Current portal traffic is intermittent.",choices:[
  ["Deploy redundant site network",()=>effect({money:-9000,infrastructure:5,eyeRep:4,info:3}, "<span class='goodtxt'>Nimbus connectivity stabilized.</span> Redundancy raises operating cost.", "IT")],
  ["Use existing infrastructure",()=>effect({money:-2500,infrastructure:1,eyeRep:1,security:-3}, "<span class='badtxt'>Cheap connectivity works, but the failure domain remains.</span>", "IT")],
  ["Send an adventuring party to inspect the site",()=>triggerCross("Nimbus inspection", "ADVENTURE", {money:-1000,info:8})]]},
 {t:"Identity Outage",d:"An Eye office cannot reliably authenticate users. Staff are sharing temporary local credentials.",choices:[
  ["Deploy centralized identity",()=>effect({money:-7000,security:5,eyeRep:5,tech:3}, "<span class='goodtxt'>Central identity is online.</span> Local credentials are being retired.", "IT")],
  ["Patch each workstation",()=>effect({money:-1800,security:-2,eyeRep:1}, "<span class='badtxt'>The outage is reduced, but the underlying management problem remains.</span>", "IT")],
  ["Escalate to government cyber authority",()=>effect({info:5,politicalRep:2,eyeRep:-1}, "Government security staff join the investigation.", "POLITICAL")]]},
 {t:"Portal Network Instability",d:"Portal telemetry shows increasing packet loss and magical instability.",choices:[
  ["Take the portal offline for maintenance",()=>effect({money:-3000,trade:-8,magic:5,security:5}, "<span class='badtxt'>The portal is safe, but commerce is disrupted.</span>", "IT")],
  ["Keep it online and tune routing",()=>effect({money:-4500,trade:5,magic:-5,infrastructure:3}, "Trade continues while the system operates closer to its limits.", "IT")],
  ["Hire adventurers to investigate the chamber",()=>triggerCross("Unstable portal investigation","ADVENTURE",{money:-1500,info:10})]]},
 {t:"Black Sky Probe",d:"Monitoring detects suspicious traffic against an Eye service.",choices:[
  ["Isolate the service",()=>effect({money:-4000,security:7,trade:-3,blackSky:-4}, "<span class='goodtxt'>The service is isolated.</span> Black Sky loses access but notices the defense.", "IT")],
  ["Observe and collect telemetry",()=>effect({info:12,blackSky:5,security:-2}, "<span class='badtxt'>You learn more about the probe, but allow continued access.</span>", "IT")],
  ["Notify Defense Force",()=>effect({security:5,politicalRep:3,info:6}, "The Defense Force begins a joint investigation.", "POLITICAL")]]}
];

const advEvents=[
 {t:"Missing Caravan",d:"A merchant caravan vanished near a cloud-road junction.",choices:[
  ["Track the caravan",()=>advResult(9,250,4,"You find the caravan abandoned. Evidence points toward organized theft.")],
  ["Question nearby merchants",()=>advResult(6,150,3,"Rumors identify a suspicious broker connected to Storm Ledger.")],
  ["Accept a higher-risk night search",()=>advResult(4,500,6,"The party finds survivors, but sustains damage during the escape.")]]},
 {t:"Abandoned Cloud Facility",d:"An old facility contains dormant machinery and a sealed data vault.",choices:[
  ["Explore carefully",()=>advResult(8,400,5,"You recover technical records that increase The Eye's knowledge.")],
